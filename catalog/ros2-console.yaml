name: ros2-console
repo: https://github.com/vgenev/ros2-console
# SHA_PENDING until the first public push, then a 40-hex digest that is not all zeros.
sha: SHA_PENDING
description: "Read a live ROS 2 graph over SSH: topic health, measured rate, one message, camera frame, doc answers with commit provenance, and one gated publish that proves delivery."
maintainer: vgenev
title: ROS 2 Console
tier: community
category: tools
requires_hermes: ">=0.22.0"
version: "0.1.0"
capabilities:
  provides_tools:
    - ros2_host_status
    - ros2_graph
    - ros2_topic_rate
    - ros2_topic_sample
    - ros2_camera_snapshot
    - ros2_docs
    - ros2_publish
image: https://raw.githubusercontent.com/vgenev/ros2-console/SHA_PENDING/docs/assets/hermes-plate.jpg
screenshots:
  - https://raw.githubusercontent.com/vgenev/ros2-console/SHA_PENDING/docs/assets/pane-topology.png
  - https://raw.githubusercontent.com/vgenev/ros2-console/SHA_PENDING/docs/assets/pane-table.png
  - https://raw.githubusercontent.com/vgenev/ros2-console/SHA_PENDING/docs/assets/pane-publish.png
known_issues: "Needs a reachable ROS 2 host over SSH. Publishing is deny-by-default: it stays off until you put a topic glob in publish_allow."
