name: ros2-console
repo: https://github.com/OWNER/ros2-console
# SHA_PENDING until the first public push, then a 40-hex digest that is not all zeros.
sha: SHA_PENDING
description: "Read a live ROS 2 graph over SSH: topic health, measured rate, one message, camera frame, plus architecture answers from your own docs corpus with repo/commit provenance."
maintainer: vgenev
tier: community
category: tools
requires_hermes: ">=0.22.0"
version: "0.1.0"
capabilities:
  provides_tools:
    - ros2_host_status
    - ros2_graph
    - ros2_topic_rate
    - ros2_topic_sample
    - ros2_camera_snapshot
    - ros2_docs
